name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build deps + the package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/semantic_sentry tests

      - name: Type-check (mypy)
        run: mypy src/semantic_sentry
        # Type-check is informational for now; remove `continue-on-error`
        # once the codebase passes mypy --strict cleanly.
        continue-on-error: true

      - name: Unit tests
        run: pytest tests/unit/ -q
